services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n8n_internal

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    # Preserve MagicDNS for private services and provide a public fallback for feeds.
    dns:
      - 100.100.100.100
      - 1.1.1.1
    ports:
      - "127.0.0.1:${N8N_LOCAL_PORT}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_EDITOR_BASE_URL: ${N8N_PROTOCOL}://${N8N_HOST}:${N8N_LOCAL_PORT}/
      WEBHOOK_URL: ${N8N_PROTOCOL}://${N8N_HOST}:${N8N_LOCAL_PORT}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n
      # Non-secret base URL for the stable Vast adapter. The bearer token stays
      # in an n8n Header Auth credential, never in this Compose file or export.
      VAST_FISH_ADAPTER: ${VAST_FISH_ADAPTER:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./prompts/editorial/agent_categorizer.md:/home/node/.n8n/prompts/agent_categorizer.md:ro
      - ./prompts/editorial/agent_queue_grouper.md:/home/node/.n8n/prompts/agent_queue_grouper.md:ro
      - ./prompts/editorial/agent_daily_news_writer.md:/home/node/.n8n/prompts/agent_daily_news_writer.md:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - n8n_internal

  remotion-renderer:
    build:
      context: ./remotion-renderer
    profiles:
      - remotion
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./remotion-renderer:/app
      - remotion_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - n8n_internal

volumes:
  postgres_data:
  n8n_data:
  remotion_node_modules:

networks:
  n8n_internal:
